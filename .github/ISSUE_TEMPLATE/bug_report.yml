name: Bug Report
description: Report a defect or unexpected behavior in a dsh-plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug report! Please provide as much detail as possible.
  - type: dropdown
    id: plugin
    attributes:
      label: Affected Plugin
      options:
        - dsh-guard
        - dsh-workbench
        - dsh-ssh
        - dsh-console
        - dsh-env
        - Monorepo / Build / CI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: DSH version, Node.js version, OS, browser.
      value: |
        - DSH Version:
        - Node.js Version:
        - OS:
